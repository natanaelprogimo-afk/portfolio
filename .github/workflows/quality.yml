name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Python standard-library test suite
        run: |
          python3 -m unittest discover -s examples/backend -p "test_*.py" -v
          python3 -m unittest discover -s examples/sql -p "test_*.py" -v
          python3 -m unittest discover -s examples/csv -p "test_*.py" -v
      - name: Validate seven-product anonymous readiness template
        run: |
          mkdir -p qa-evidence
          npm run commercial:check > qa-evidence/commercial-readiness.json
          npm run test:commercial
      - name: Unit tests and static smoke tests
        run: npm test
      - name: Install browser test runner (ephemeral)
        run: npm install --no-save --no-package-lock playwright@1.56.1 @axe-core/playwright@4.14.0
      - name: Browser E2E - Chrome desktop/mobile
        run: node scripts/browser.e2e.mjs
      - name: Automated WCAG accessibility regression
        run: node scripts/accessibility.e2e.mjs
      - name: Store real browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portfolio-browser-qa
          path: qa-evidence/
          if-no-files-found: ignore
      - name: Build for GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Smoke and static integrity checks (GitHub Pages)
        run: |
          npm run test:smoke
          npm run test:integrity
        env:
          GITHUB_PAGES: 'true'

name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Python standard-library test suite
        run: |
          python3 -m unittest discover -s examples/backend -p "test_*.py" -v
          python3 -m unittest discover -s examples/sql -p "test_*.py" -v
      - name: Unit tests and static smoke tests
        run: npm test
      - name: Install browser test runner (ephemeral)
        run: npm install --no-save --no-package-lock playwright@1.56.1 @axe-core/playwright@4.14.0
      - name: Browser E2E - Chrome desktop/mobile
        run: node scripts/browser.e2e.mjs
      - name: Automated WCAG accessibility regression
        run: node scripts/accessibility.e2e.mjs
      - name: Store real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-qa
          path: qa-evidence/
          if-no-files-found: ignore
      - name: Build for GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Smoke and static integrity checks (GitHub Pages)
        run: |
          npm run test:smoke
          npm run test:integrity
        env:
          GITHUB_PAGES: 'true'

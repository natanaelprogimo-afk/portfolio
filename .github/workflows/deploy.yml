name: Deploy GitHub Pages

# A successful full quality run on main is required before deployment.
# A PR check cannot publish: this trigger is restricted to the main branch.
on:
  workflow_run:
    workflows: ["Quality checks"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the exact commit that passed QA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Confirm production commit matches the quality run
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - name: Lint and build Pages output
        run: |
          npm run lint
          npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Verify generated output before publication
        run: |
          npm test
          npm run test:integrity
          python3 -m unittest discover -s examples/backend -p "test_*.py" -v
          python3 -m unittest discover -s examples/sql -p "test_*.py" -v
        env:
          GITHUB_PAGES: 'true'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
